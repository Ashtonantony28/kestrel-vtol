# Kestrel lean quadplane: single source of truth for vehicle parameters.
# Units SI. Body frame FRD (x forward, y right, z down), origin at wing root leading edge (LE),
# x positive forward, so aft stations are negative. ADR 0001.
name: kestrel-lean
version: 2

environment:
  rho: 1.225            # kg/m^3, sea level ISA
  g: 9.80665

wing:                   # foamboard flying wing, folded (Armin-style) airfoil approximated by Selig S5010 (reflexed flying-wing
  # section). Chosen in docs/adr/0003 from a sweep of airfoil x washout x sweep x static margin for zero-elevon trim.
  airfoil: s5020
  span: 1.00
  root_chord: 0.32
  tip_chord: 0.22
  le_sweep_deg: 30.0
  dihedral_deg: 0.0
  tip_twist_deg: -8.0   # washout (set with a printed twist jig at glue-up): trims the tailless wing with ~0 elevon
  elevon_chord_frac: 0.25
  elevon_span_frac: [0.25, 0.95]   # fraction of semispan
  elevon_max_deg: 20.0
  winglet_height: 0.10
  winglet_root_chord: 0.14

fuselage:               # foam pod on the wing centreline carrying battery + avionics
  length: 0.52          # tail extends to carry the pusher clear of the swept trailing edge
  width: 0.07
  height: 0.06
  nose_x: 0.13          # pod nose is 13 cm ahead of root LE (battery bay)

booms:                  # two carbon tubes parallel to x (cut from 1 m tubes)
  half_spacing_rotors: 0.35   # rotors at CG +/- 0.35 m (rear disc mostly behind the trailing edge)
  y: 0.25               # lateral position (+/-); 10" prop inner tip 123 mm from centreline
  diameter: 0.010       # 10x8 mm tube: first bending mode ~37 Hz (8x6 would be ~26 Hz, too close to the rate loop)
  inner_diameter: 0.008
  length: 0.85
  x_front: 0.217         # front end station
  # rear end = x_front - length

lift_rotors:            # quad X; positions are motor axes. Rotor centroid = design CG (equal hover load)
  x_front: 0.182        # front disc fully ahead of the wing LE
  x_rear: -0.518        # rear disc overlaps only the last few cm of the wing (less hover download)
  y: 0.25
  z: -0.035             # prop plane above the boom
  # ArduPilot QuadPlane motor numbering (Q_FRAME_TYPE=1, X): 1 front-right CCW, 2 rear-left CCW, 3 front-left CW, 4 rear-right CW

pusher:
  x: -0.41              # ~50 mm behind the swept trailing edge at the prop tip radius
  y: 0.0
  z: -0.04              # raised so the prop tip clears the ground on short legs

landing_legs:           # 4 printed PETG legs under the motor mounts
  height: 0.085         # below boom centreline
  mass_each: 0.005

propulsion:
  lift_motor: a2212_1000kv
  lift_prop: prop_10x45
  pusher_motor: a2212_1400kv   # trade study: excess thrust 2.7x at cruise (1000KV+9x6 only 1.9x)
  pusher_prop: prop_8x6
  esc_max_a: 30.0
  battery: lipo_3s_2200

motors:                 # budget A2212 class. rm is an EFFECTIVE resistance (winding + ESC + leads + timing losses)
  # fitted so the model reproduces the typical published point for A2212/13T 1000KV with a 10x4.5 prop on 3S:
  # ~7600 rpm, 11.5 A, ~840 gf at 11.1 V (tests/test_propulsion.py). VERIFY on a kitchen-scale thrust test (build/BENCH.md).
  a2212_1000kv: {kv: 1000.0, rm: 0.30, i0: 0.50, mass: 0.052, i_max_cont: 13.0}
  a2212_1400kv: {kv: 1400.0, rm: 0.22, i0: 0.70, mass: 0.050, i_max_cont: 15.0}

props:                  # UIUC-database-shaped coefficients scaled to cheap slow-fly props (ct x0.876, cp x0.70) so the
  # 10x4.5 reproduces the datasheet point above. Same scaling applied to all props for a consistent trade study.
  # thrust T = ct(J) rho n^2 D^4, power P = cp(J) rho n^3 D^5, n in rev/s. ct, cp linear-in-J models (j0 = zero-thrust advance ratio)
  prop_10x45: {d: 0.254, ct0: 0.1007, cp0: 0.0317, j0_ct: 0.55, j0_cp: 0.72, mass: 0.012}
  prop_9x45:  {d: 0.229, ct0: 0.0964, cp0: 0.0308, j0_ct: 0.58, j0_cp: 0.75, mass: 0.010}
  prop_9x6:   {d: 0.229, ct0: 0.1051, cp0: 0.0434, j0_ct: 0.76, j0_cp: 0.95, mass: 0.011}
  prop_8x6:   {d: 0.203, ct0: 0.1095, cp0: 0.0476, j0_ct: 0.85, j0_cp: 1.05, mass: 0.009}

batteries:
  lipo_3s_2200: {cells: 3, capacity_ah: 2.2, r_int: 0.030, mass: 0.185, usable_frac: 0.80, v_cell_nom: 3.75, v_cell_full: 4.20, v_cell_empty: 3.50}

# Mass items (kg) with station (x, y, z) in body frame. Airframe items from CAD in M1 (cad/build.py writes cad/mass_props.json).
mass_items:
  wing_foam:       {m: 0.115, x: -0.165, z: 0.0}
  winglets:        {m: 0.012, x: -0.37,  z: -0.04}
  spar_and_glue:   {m: 0.040, x: -0.10,  z: 0.0}
  fuselage_pod:    {m: 0.040, x: -0.10,  z: 0.02}
  booms:           {m: 0.066, x: -0.208,  z: 0.012}   # 2 x 0.75 m x 44 g/m
  printed_mounts:  {m: 0.040, x: -0.168, z: 0.0}
  lift_motors:     {m: 0.208, x: -0.168, z: -0.02}   # 4 x 52 g, centroid of front/rear pairs
  lift_props:      {m: 0.048, x: -0.168, z: -0.04}
  lift_escs:       {m: 0.100, x: -0.168, z: 0.012}   # 4 x 25 g on booms
  pusher_motor:    {m: 0.052, x: -0.33,  z: -0.04}
  pusher_prop:     {m: 0.011, x: -0.36,  z: -0.04}
  landing_legs:    {m: 0.020, x: -0.168, z: 0.06}
  pusher_esc:      {m: 0.025, x: -0.24,  z: 0.02}
  servos:          {m: 0.018, x: -0.28,  z: 0.0}
  flight_controller: {m: 0.019, x: -0.06, z: 0.02}
  gps:             {m: 0.012, x: -0.18,  z: -0.03}
  receiver:        {m: 0.003, x: -0.20,  z: 0.02}
  wiring:          {m: 0.040, x: -0.12,  z: 0.02}
  battery:         {m: 0.185, x: -0.036,  z: 0.03}   # slid fore/aft to set CG (solved for 8 % static margin)

limits:
  target_hover_tw: 2.0
  min_endurance_min: 12.0
  reserve_frac: 0.20
  max_bom_usd: 240.0
  static_margin: [0.04, 0.16]      # minimum LOCAL margin -dCm/dCL over 2..15 deg alpha must stay inside
  target_static_margin: 0.05       # applied to the minimum local margin
  max_stall_mps: 10.5   # TRIMMED stall (tailless wing); quadplane lifts take over below ARSPD_FBW_MIN = 12 m/s

mission_profile:        # for endurance estimate
  hover_s: 120          # total VTOL time (takeoff + landing + transitions)
  cruise_mps: 14.0
  avionics_w: 2.5
